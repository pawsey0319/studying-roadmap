name: 安卓安装包

# 手动运行，或推送 v 开头的标签（例如 v3.0.0）时自动运行。
# 签名用的四个 Secrets：ANDROID_KEYSTORE_BASE64、ANDROID_KEYSTORE_PASSWORD、ANDROID_KEY_ALIAS、ANDROID_KEY_PASSWORD。
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: 单元测试
        run: node --test tests/*.test.js
      - name: 最新的资讯快照一起打进安装包（失败不影响）
        run: |
          python3 tools/fetch_sources.py || echo "部分来源抓取失败"
          python3 tools/fetch_hot.py || echo "快讯抓取失败"
          GITHUB_TOKEN=${{ github.token }} python3 tools/fetch_github.py || echo "GitHub 数据抓取失败"
      - name: 生成安卓工程
        working-directory: app
        run: |
          npm ci --no-audit --no-fund
          bash build-web.sh
          npx cap add android
          npx capacitor-assets generate --android
          npx cap sync android
          python3 patch-android.py "${{ github.run_number }}" "3.0.${{ github.run_number }}"
      - name: 还原签名文件
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then echo "::error::没有设置 ANDROID_KEYSTORE_BASE64，无法签名"; exit 1; fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: 打包并签名
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME"/build-tools | sort -V | tail -1)/apksigner verify --print-certs "$APK" | head -3
          mkdir -p "$GITHUB_WORKSPACE/out" && cp "$APK" "$GITHUB_WORKSPACE/out/learning-hub-3.0.${{ github.run_number }}.apk"
      - name: 删掉签名文件
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: learning-hub-apk
          path: out/*.apk
          retention-days: 30
      - name: 发布到 Releases（推送标签时）
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" out/*.apk --title "学习路线 ${{ github.ref_name }}" --notes "安卓安装包。下载 APK 后在手机上打开安装；第一次需要允许“安装未知应用”。"
