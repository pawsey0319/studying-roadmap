name: 部署网站并刷新快照

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"   # 每天 UTC 0 点，即北京时间早上 8 点
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 单元测试（失败则不部署，避免把坏数据发布出去）
        run: node --test tests/*.test.js
      - name: 抓取官方博客与媒体快照
        # 个别来源失败不影响部署，脚本会把失败情况写进快照
        run: python3 tools/fetch_sources.py || echo "部分来源抓取失败"
      - name: 访问一次云端数据库，避免 Supabase 免费版因 7 天无访问被暂停
        # 只在仓库里有 config.json（内测云端配置）时执行；publishable/anon key 本来就是公开的，行级安全规则下查不到任何数据
        run: |
          if [ -f config.json ]; then
            url=$(python3 -c "import json;print(json.load(open('config.json')).get('supabaseUrl',''))")
            key=$(python3 -c "import json;print(json.load(open('config.json')).get('supabaseAnonKey',''))")
            if [ -n "$url" ] && [ -n "$key" ]; then
              curl -s -o /dev/null -w "Supabase 返回 %{http_code}\n" "$url/rest/v1/docs?select=name&limit=1" -H "apikey: $key" || true
            fi
          fi
      - name: 只发布网站需要的文件
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js icons src content data vendor _site/
          [ -f config.json ] && cp config.json _site/ || true
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
