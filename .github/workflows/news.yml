name: 资讯与快讯同步到云端

# 每 2 小时：抓财经快讯（财联社、华尔街见闻、金十、雪球热股）和每日快照，写进腾讯云开发的 hot_items / news_items 表。
# App 和网站打开时直接读这两张表，不用等网站重新部署。
# 需要仓库 Secrets：CLOUDBASE_ENV（环境 ID）、CLOUDBASE_API_KEY（云开发控制台 → API Key 配置 → 服务端 API Key，管理员权限，只放这里）。
# 可选：MINIFLUX_URL + MINIFLUX_TOKEN（部署了 Miniflux 后，从它拉国内 RSS，并把这里抓到的海外条目推给它）。
on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: news
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDBASE_ENV: ${{ secrets.CLOUDBASE_ENV }}
      CLOUDBASE_API_KEY: ${{ secrets.CLOUDBASE_API_KEY }}
      MINIFLUX_URL: ${{ secrets.MINIFLUX_URL }}
      MINIFLUX_TOKEN: ${{ secrets.MINIFLUX_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: 财经快讯
        run: python3 tools/fetch_hot.py
      - name: 海外与官方源快照
        run: python3 tools/fetch_sources.py || echo "部分来源抓取失败"
      - name: 写进云端
        run: |
          if [ -z "$CLOUDBASE_ENV" ] || [ -z "$CLOUDBASE_API_KEY" ]; then echo "没有配置 CLOUDBASE_ENV / CLOUDBASE_API_KEY，跳过"; exit 0; fi
          python3 tools/news_sync.py --push-overseas
