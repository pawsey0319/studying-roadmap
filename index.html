<script>
// 直接双击打开本地文件时，浏览器不允许加载模块和数据文件，这里给出提示
if (location.protocol === 'file:') document.getElementById('view').innerHTML =
  '<p class="note">本地文件不能直接双击打开。请在仓库目录运行 <code>python3 -m http.server</code>（Windows 用 <code>python -m http.server</code>），再打开 http://localhost:8000/ 。线上网址不受影响。</p>';
</script>
<script>
// 启动异常必须可见：不让用户永久停在骨架，也不清除学习数据。
window.__lhBootStage = '加载页面脚本';
window.addEventListener('error', function (e) { window.__lhBootError = e.message || '脚本资源未加载'; });
window.addEventListener('unhandledrejection', function (e) { window.__lhBootError = e.reason && e.reason.message || '启动请求失败'; });
setTimeout(function () {
  var v = document.getElementById('view');
  if (!v || !v.querySelector('.skel')) return;
  var p = document.createElement('p'); p.className = 'note'; p.setAttribute('role', 'status');
  p.textContent = '页面启动尚未完成。当前步骤：' + window.__lhBootStage + (window.__lhBootError ? '；错误：' + window.__lhBootError : '。请将这行状态反馈给开发者；不要清除浏览器数据。');
  v.replaceChildren(p);
}, 12000);
</script>
